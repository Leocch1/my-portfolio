<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- Display image for My Global Connection; render with headless Chrome at 1600x900 to public/myglobalconnection.png -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(140deg, #f3fbfd 0%, #dff3f7 45%, #c6e8ef 100%);
  }

  /* Faint chart grid, echoing the site's background */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0, 150, 178, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 150, 178, 0.07) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); }
  .b1 { width: 720px; height: 720px; left: -200px; top: -260px; background: rgba(0, 184, 212, 0.35); }
  .b2 { width: 680px; height: 680px; right: -180px; bottom: -280px; background: rgba(0, 150, 178, 0.35); }
  .b3 { width: 520px; height: 420px; left: 560px; top: 260px; background: rgba(255, 255, 255, 0.7); }

  /* Soft rings behind the devices */
  .ring { position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 1.5px dashed rgba(0, 150, 178, 0.22); transform: translate(-50%, -50%); }
  .r1 { width: 820px; height: 820px; }
  .r2 { width: 1180px; height: 1180px; border-style: solid; border-color: rgba(0, 150, 178, 0.12); }

  /* Browser window */
  .browser {
    position: absolute; left: 215px; top: 150px; width: 1040px;
    border-radius: 18px; overflow: hidden; background: #fff;
    box-shadow: 0 50px 100px rgba(12, 62, 72, 0.22), 0 14px 30px rgba(12, 62, 72, 0.14);
    border: 1px solid rgba(12, 62, 72, 0.08);
  }
  .bar {
    height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px;
    background: linear-gradient(#f7fafd, #eef4f9); border-bottom: 1px solid rgba(12, 62, 72, 0.08);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .url {
    margin-left: 18px; flex: 0 0 360px; height: 24px; border-radius: 12px; background: #fff;
    border: 1px solid rgba(12, 62, 72, 0.1); display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 12px; color: #4a6378;
  }
  .url svg { width: 11px; height: 11px; }
  .browser img { display: block; width: 100%; height: auto; }

  /* iPhone */
  .phone {
    position: absolute; left: 1100px; top: 172px; width: 296px; padding: 12px;
    border-radius: 56px; background: #0d1117;
    box-shadow:
      0 50px 90px rgba(12, 62, 72, 0.32), 0 16px 30px rgba(12, 62, 72, 0.2),
      inset 0 0 0 2px #2a313b, inset 0 0 0 5px #0d1117;
  }
  .phone::before, .phone::after {
    /* side buttons */
    content: ''; position: absolute; width: 4px; border-radius: 2px; background: #1f2630;
  }
  .phone::before { left: -3px; top: 150px; height: 60px; }
  .phone::after { right: -3px; top: 190px; height: 90px; }
  .screen { position: relative; border-radius: 44px; overflow: hidden; background: #fff; }
  .island {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 76px; height: 24px; border-radius: 12px; background: #000; z-index: 2;
  }
  .status {
    height: 44px; display: flex; align-items: center; justify-content: space-between;
    padding: 4px 20px 0 28px; font-size: 14px; font-weight: 600; color: #fff; background: #00b8d4;
  }
  .status .icons { display: flex; gap: 4px; align-items: center; }
  .status svg { height: 10px; width: auto; }
  .screen img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="grid"></div>
  <div class="ring r1"></div>
  <div class="ring r2"></div>

  <div class="browser">
    <div class="bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <div class="url">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        myglobeconnect.com/en
      </div>
    </div>
    <img src="desktop.png" alt="" />
  </div>

  <div class="phone">
    <div class="screen">
      <div class="island"></div>
      <div class="status">
        <span>9:41</span>
        <span class="icons">
          <svg viewBox="0 0 18 11" fill="#fff"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="6" rx="1"/><rect x="10" y="2.5" width="3" height="8.5" rx="1"/><rect x="15" y="0" width="3" height="11" rx="1"/></svg>
          <svg viewBox="0 0 16 11" fill="#fff"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.6 6.6 0 0 0 8 4a6.6 6.6 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.6c.4 0 .8.2 1.1.4L8 11 6.9 9.8c.3-.2.7-.4 1.1-.4Z"/></svg>
          <svg viewBox="0 0 27 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="#fff" opacity="0.5"/><rect x="2" y="2" width="19" height="8" rx="1.8" fill="#fff"/><path d="M24.5 4v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2Z" fill="#fff" opacity="0.5"/></svg>
        </span>
      </div>
      <img src="mobile.png" alt="" />
    </div>
  </div>
</body>
</html>
