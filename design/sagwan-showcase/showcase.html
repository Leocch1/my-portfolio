<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- Display image for Sagwan; render with headless Chrome at 1600x900 to public/sagwan.png -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(160deg, #0b2440 0%, #0f3a5c 45%, #17607a 100%);
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(100px); }
  .b1 { width: 700px; height: 700px; left: -220px; top: -260px; background: rgba(90, 179, 165, 0.35); }
  .b2 { width: 720px; height: 720px; right: -200px; bottom: -300px; background: rgba(90, 179, 165, 0.4); }
  .b3 { width: 600px; height: 380px; left: 500px; top: 300px; background: rgba(160, 220, 235, 0.18); }

  /* Ocean swells along the bottom */
  .waves { position: absolute; left: 0; right: 0; bottom: 0; height: 320px; }

  .browser {
    position: absolute; left: 290px; top: 110px; width: 1020px;
    border-radius: 18px; overflow: hidden; background: #fff;
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 50px 100px rgba(2, 16, 30, 0.5), 0 14px 30px rgba(2, 16, 30, 0.3);
  }
  .bar {
    height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 16px;
    background: linear-gradient(#f6fafd, #edf4f8); border-bottom: 1px solid rgba(11, 36, 64, 0.08);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .url {
    margin-left: 18px; flex: 0 0 340px; height: 24px; border-radius: 12px; background: #fff;
    border: 1px solid rgba(11, 36, 64, 0.1); display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 12px; color: #3d5a73;
  }
  .url svg { width: 11px; height: 11px; }
  .browser img { display: block; width: 100%; }

  /* iPhones */
  .phone {
    position: absolute; width: 264px; padding: 12px; z-index: 3;
    border-radius: 52px; background: #0d1117;
    box-shadow:
      0 0 0 1.5px rgba(255, 255, 255, 0.2), 0 50px 90px rgba(2, 16, 30, 0.55), 0 16px 30px rgba(2, 16, 30, 0.35),
      inset 0 0 0 2px #2a313b, inset 0 0 0 5px #0d1117;
  }
  .phone::before, .phone::after { content: ''; position: absolute; width: 4px; border-radius: 2px; background: #1f2630; }
  .phone::before { left: -3px; top: 130px; height: 56px; }
  .phone::after { right: -3px; top: 170px; height: 84px; }
  .login { left: 200px; top: 318px; }
  .feed { left: 1136px; top: 196px; }

  .screen { position: relative; height: 520px; border-radius: 41px; overflow: hidden; }
  .login .screen { background: linear-gradient(#bfd8e5 0 34px, #0c2b4a 34px); padding-top: 34px; }
  .feed .screen { background: #e2eaf4; padding-top: 38px; }
  .screen img { display: block; width: 100%; }

  .island {
    position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
    width: 72px; height: 22px; border-radius: 11px; background: #000; z-index: 2;
  }
  .status {
    position: absolute; top: 0; left: 0; right: 0; height: 38px; z-index: 1;
    display: flex; align-items: center; justify-content: space-between;
    padding: 2px 18px 0 26px; font-size: 13px; font-weight: 600; color: #0b2440;
  }
  .status .icons { display: flex; gap: 4px; align-items: center; }
  .status svg { height: 9px; width: auto; }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <svg class="waves" viewBox="0 0 1600 320" preserveAspectRatio="none">
    <path d="M0 150 C 220 90, 420 210, 640 150 S 1060 90, 1280 150 S 1500 200, 1600 160 V320 H0Z" fill="rgba(90,179,165,0.10)"/>
    <path d="M0 210 C 260 160, 460 260, 720 210 S 1140 160, 1380 215 S 1560 240, 1600 225 V320 H0Z" fill="rgba(90,179,165,0.12)"/>
    <path d="M0 265 C 300 230, 520 300, 800 265 S 1220 230, 1600 270 V320 H0Z" fill="rgba(11,36,64,0.35)"/>
  </svg>

  <div class="browser">
    <div class="bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <div class="url">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        sagwan.app
      </div>
    </div>
    <img src="desktop.png" alt="" />
  </div>

  <div class="phone login">
    <div class="screen">
      <div class="island"></div>
      <div class="status">
        <span>9:41</span>
        <span class="icons">
          <svg viewBox="0 0 18 11" fill="#0b2440"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="6" rx="1"/><rect x="10" y="2.5" width="3" height="8.5" rx="1"/><rect x="15" y="0" width="3" height="11" rx="1"/></svg>
          <svg viewBox="0 0 16 11" fill="#0b2440"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.6 6.6 0 0 0 8 4a6.6 6.6 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.6c.4 0 .8.2 1.1.4L8 11 6.9 9.8c.3-.2.7-.4 1.1-.4Z"/></svg>
          <svg viewBox="0 0 27 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="#0b2440" opacity="0.5"/><rect x="2" y="2" width="19" height="8" rx="1.8" fill="#0b2440"/><path d="M24.5 4v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2Z" fill="#0b2440" opacity="0.5"/></svg>
        </span>
      </div>
      <img src="login.png" alt="" />
    </div>
  </div>

  <div class="phone feed">
    <div class="screen">
      <div class="island"></div>
      <div class="status">
        <span>9:41</span>
        <span class="icons">
          <svg viewBox="0 0 18 11" fill="#0b2440"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="6" rx="1"/><rect x="10" y="2.5" width="3" height="8.5" rx="1"/><rect x="15" y="0" width="3" height="11" rx="1"/></svg>
          <svg viewBox="0 0 16 11" fill="#0b2440"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.6 6.6 0 0 0 8 4a6.6 6.6 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.6c.4 0 .8.2 1.1.4L8 11 6.9 9.8c.3-.2.7-.4 1.1-.4Z"/></svg>
          <svg viewBox="0 0 27 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="#0b2440" opacity="0.5"/><rect x="2" y="2" width="19" height="8" rx="1.8" fill="#0b2440"/><path d="M24.5 4v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2Z" fill="#0b2440" opacity="0.5"/></svg>
        </span>
      </div>
      <img src="feed.png" alt="" />
    </div>
  </div>
</body>
</html>
